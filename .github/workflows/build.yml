name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  ANDROID_HOME: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK and Build Tools
        run: |
          # 设置 SDK 管理器环境变量
          export JAVA_OPTS="-XX:+IgnoreUnrecognizedVMOptions"
          
          # 检查当前 SDK 状态
          echo "Current SDK root: $ANDROID_SDK_ROOT"
          ls -la $ANDROID_SDK_ROOT/
          
          # 尝试使用现有的 cmdline-tools
          if [ -d "$ANDROID_SDK_ROOT/cmdline-tools/latest" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          elif [ -d "$ANDROID_SDK_ROOT/tools/bin" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/tools/bin/sdkmanager"
          else
            echo "No sdkmanager found, downloading..."
            mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
            cd $ANDROID_SDK_ROOT/cmdline-tools
            wget https://dl.google.com/android/repository/commandlinetools-linux-8512546_latest.zip
            unzip commandlinetools-linux-8512546_latest.zip
            mv cmdline-tools latest
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          
          # 安装必要的组件，使用 yes 命令自动接受许可证
          echo "Installing build tools and platform..."
          yes | $SDKMANAGER --sdk_root=$ANDROID_SDK_ROOT "build-tools;33.0.0"
          yes | $SDKMANAGER --sdk_root=$ANDROID_SDK_ROOT "platform-tools"
          yes | $SDKMANAGER --sdk_root=$ANDROID_SDK_ROOT "platforms;android-33"
          
          # 验证安装
          echo "Verifying installation..."
          ls -la $ANDROID_SDK_ROOT/build-tools/
          if [ -d "$ANDROID_SDK_ROOT/build-tools/33.0.0" ]; then
            echo "Build tools 33.0.0 installed successfully"
            ls -la $ANDROID_SDK_ROOT/build-tools/33.0.0/
          else
            echo "Build tools 33.0.0 not found!"
            exit 1
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleRelease --warning-mode all

      - name: Sign APK
        id: sign
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "33.0.0"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed
          path: ${{ steps.sign.outputs.signedReleaseFile }}
          retention-days: 7